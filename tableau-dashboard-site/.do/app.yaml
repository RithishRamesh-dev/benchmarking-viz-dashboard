name: tableau-dashboard-site
region: nyc
services:
- name: web
  github:
    branch: main
    deploy_on_push: true
  environment_slug: python
  run_command: gunicorn --worker-tmp-dir /dev/shm --config gunicorn_config_appplatform.py app:app
  http_port: 8080
  instance_count: 1
  instance_size_slug: basic-xxs
  routes:
  - path: /
  envs:
  - key: FLASK_ENV
    value: production
  - key: SECRET_KEY
    value: ${SECRET_KEY}
    type: SECRET